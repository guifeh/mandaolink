<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e3b43" />
    <title>Pendências — protótipo MandaoLink</title>
    <!-- Só no protótipo: no app, a Archivo é servida pelo próprio PWA (@fontsource-variable/archivo). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../apps/pwa/src/styles/tokens.css" />
    <link rel="stylesheet" href="../../../apps/pwa/src/styles/componentes.css" />
    <style>
      html,
      body {
        margin: 0;
      }
    </style>
  </head>
  <body class="ml-app">
    <a class="ml-pular" href="#conteudo">Pular para o conteúdo</a>
    <nav class="ml-nav" aria-label="Navegação principal">
      <span class="ml-nav__marca">MandaoLink</span>
      <a class="ml-nav__item" href="#"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="1.6" />
          <path
            d="M8.6 8.6a4.8 4.8 0 0 0 0 6.8M15.4 8.6a4.8 4.8 0 0 1 0 6.8M5.7 5.7a8.9 8.9 0 0 0 0 12.6M18.3 5.7a8.9 8.9 0 0 1 0 12.6"
          /></svg
        ><span>Início</span></a
      >
      <a class="ml-nav__item" href="#" aria-current="page"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2h-14z" />
          <path d="M10 20.5a2 2 0 0 0 4 0" /></svg
        ><span>Pendências</span><span class="ml-nav__contador" aria-label="1 pendência">1</span></a
      >
      <a class="ml-nav__item" href="#"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 12a8.5 8.5 0 1 0 2.5-6" />
          <path d="M3.5 4v4.5H8" />
          <path d="M12 7.5V12l3 2" /></svg
        ><span>Histórico</span></a
      >
      <a class="ml-nav__item" href="#"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 4v5M6 13v7M12 4v1.5M12 9.5V20M18 4v9.5M18 17.5V20" />
          <circle cx="6" cy="11" r="2" />
          <circle cx="12" cy="7.5" r="2" />
          <circle cx="18" cy="15.5" r="2" /></svg
        ><span>Ajustes</span></a
      >
    </nav>
    <main class="ml-principal" id="conteudo">
      <div class="ml-conteudo">
        <header>
          <h1 class="ml-tela-titulo">Pendências</h1>
          <p class="ml-tela-desc">Cada item leva direto ao conserto. Comece pelo de cima.</p>
        </header>
        <ul class="ml-lista ml-lista--grade" style="gap: var(--esp-3)">
          <li class="ml-item ml-item--coluna">
            <div style="display: flex; gap: 12px; align-items: flex-start">
              <span class="ml-item__ponto ml-item__ponto--vermelho" style="margin-top: 7px"></span>
              <div class="ml-item__texto">
                <strong>Envios pausados por falhas</strong
                ><span class="ml-item__meta" style="font-size: var(--texto-sm)"
                  >5 envios seguidos falharam às 10h03. Pausamos para proteger o número.</span
                >
              </div>
            </div>
            <button type="button" class="ml-botao ml-botao--principal ml-botao--largo">Retomar os envios</button
            ><button type="button" class="ml-botao ml-botao--texto">Ver o que falhou</button>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
