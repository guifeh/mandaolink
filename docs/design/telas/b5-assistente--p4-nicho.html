<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e3b43" />
    <title>Primeira configuração — protótipo MandaoLink</title>
    <!-- Só no protótipo: no app, a Archivo é servida pelo próprio PWA (@fontsource-variable/archivo). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../apps/pwa/src/styles/tokens.css" />
    <link rel="stylesheet" href="../../../apps/pwa/src/styles/componentes.css" />
    <style>
      html,
      body {
        margin: 0;
      }
    </style>
  </head>
  <body class="ml-app">
    <a class="ml-pular" href="#conteudo">Pular para o conteúdo</a>

    <main class="ml-principal" id="conteudo">
      <div class="ml-conteudo" style="max-width: 560px; margin-inline: auto; padding-bottom: var(--esp-10)">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-weight: 800; font-variation-settings: 'wdth' 70; font-size: 1.5rem; color: var(--cor-casco)"
            >MandaoLink</span
          ><button type="button" class="ml-botao ml-botao--texto">Terminar depois</button>
        </div>
        <div class="ml-progresso">
          <span>Passo 4 de 5: Nicho</span>
          <div class="ml-progresso__trilho" aria-hidden="true">
            <span data-feito></span><span data-feito></span><span data-feito></span><span data-feito></span
            ><span></span>
          </div>
        </div>
        <div>
          <h1 class="ml-tela-titulo">Qual é o assunto do grupo?</h1>
          <p class="ml-tela-desc">
            Só passam ofertas com pelo menos uma destas palavras. Dá para mudar depois em Ajustes.
          </p>
        </div>
        <div class="ml-campo">
          <label class="ml-campo__rotulo" for="nn">Nome do nicho</label
          ><input class="ml-campo__entrada" id="nn" value="Carro" />
        </div>
        <div class="ml-campo">
          <label class="ml-campo__rotulo" for="pw">Palavras do nicho</label>
          <div class="ml-campo__linha">
            <input class="ml-campo__entrada" id="pw" placeholder="Ex.: pneu…" /><button
              type="button"
              class="ml-botao ml-botao--secundario"
            >
              Adicionar
            </button>
          </div>
        </div>
        <ul class="ml-chips">
          <li class="ml-chip">
            <span class="ml-chip__texto">suporte veicular</span
            ><button type="button" class="ml-chip__remover" aria-label="Remover suporte veicular">×</button>
          </li>
          <li class="ml-chip">
            <span class="ml-chip__texto">pneu</span
            ><button type="button" class="ml-chip__remover" aria-label="Remover pneu">×</button>
          </li>
          <li class="ml-chip">
            <span class="ml-chip__texto">aspirador automotivo</span
            ><button type="button" class="ml-chip__remover" aria-label="Remover aspirador automotivo">×</button>
          </li>
        </ul>
        <div class="ml-secao">
          <button type="button" class="ml-botao ml-botao--principal ml-botao--largo">Continuar</button
          ><button type="button" class="ml-botao ml-botao--texto">Voltar</button>
        </div>
      </div>
    </main>
  </body>
</html>
