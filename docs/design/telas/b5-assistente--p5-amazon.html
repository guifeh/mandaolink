<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e3b43" />
    <title>Primeira configuração — protótipo MandaoLink</title>
    <!-- Só no protótipo: no app, a Archivo é servida pelo próprio PWA (@fontsource-variable/archivo). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../apps/pwa/src/styles/tokens.css" />
    <link rel="stylesheet" href="../../../apps/pwa/src/styles/componentes.css" />
    <style>
      html,
      body {
        margin: 0;
      }
    </style>
  </head>
  <body class="ml-app">
    <a class="ml-pular" href="#conteudo">Pular para o conteúdo</a>

    <main class="ml-principal" id="conteudo">
      <div class="ml-conteudo" style="max-width: 560px; margin-inline: auto; padding-bottom: var(--esp-10)">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-weight: 800; font-variation-settings: 'wdth' 70; font-size: 1.5rem; color: var(--cor-casco)"
            >MandaoLink</span
          ><button type="button" class="ml-botao ml-botao--texto">Terminar depois</button>
        </div>
        <div class="ml-progresso">
          <span>Passo 5 de 5: Conta Amazon</span>
          <div class="ml-progresso__trilho" aria-hidden="true">
            <span data-feito></span><span data-feito></span><span data-feito></span><span data-feito></span
            ><span data-feito></span>
          </div>
        </div>
        <div>
          <h1 class="ml-tela-titulo">Sua tag da Amazon</h1>
          <p class="ml-tela-desc">
            Ela vai em todos os links. Fica no painel do Programa de Associados e termina em -20.
          </p>
        </div>
        <div class="ml-campo">
          <label class="ml-campo__rotulo" for="tg5">Tag de associado</label
          ><input
            class="ml-campo__entrada"
            id="tg5"
            autocapitalize="none"
            spellcheck="false"
            placeholder="minhaloja-20"
          />
        </div>
        <div class="ml-secao">
          <button type="button" class="ml-botao ml-botao--principal ml-botao--largo">Concluir</button
          ><button type="button" class="ml-botao ml-botao--texto">Voltar</button>
        </div>
      </div>
    </main>
  </body>
</html>
