<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e3b43" />
    <title>Primeira configuração — protótipo MandaoLink</title>
    <!-- Só no protótipo: no app, a Archivo é servida pelo próprio PWA (@fontsource-variable/archivo). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../apps/pwa/src/styles/tokens.css" />
    <link rel="stylesheet" href="../../../apps/pwa/src/styles/componentes.css" />
    <style>
      html,
      body {
        margin: 0;
      }
    </style>
  </head>
  <body class="ml-app">
    <a class="ml-pular" href="#conteudo">Pular para o conteúdo</a>

    <main class="ml-principal" id="conteudo">
      <div class="ml-conteudo" style="max-width: 560px; margin-inline: auto; padding-bottom: var(--esp-10)">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-weight: 800; font-variation-settings: 'wdth' 70; font-size: 1.5rem; color: var(--cor-casco)"
            >MandaoLink</span
          ><button type="button" class="ml-botao ml-botao--texto">Terminar depois</button>
        </div>
        <div class="ml-progresso">
          <span>Passo 3 de 5: Grupos de origem</span>
          <div class="ml-progresso__trilho" aria-hidden="true">
            <span data-feito></span><span data-feito></span><span data-feito></span><span></span><span></span>
          </div>
        </div>
        <div>
          <h1 class="ml-tela-titulo">De onde vêm as ofertas?</h1>
          <p class="ml-tela-desc">Escolha os grupos de promoção que o sistema vai ler.</p>
        </div>
        <div class="ml-aviso ml-aviso--atencao">
          <span class="ml-aviso__texto">Use só grupos cujos administradores autorizaram o uso das ofertas.</span>
        </div>
        <div class="ml-secao">
          <label class="ml-opcao"
            ><input type="checkbox" name="o" checked /><span class="ml-item__texto"
              ><span class="ml-item__titulo">Promoções Auto BR</span
              ><span class="ml-item__meta">1.024 participantes</span></span
            ></label
          ><label class="ml-opcao"
            ><input type="checkbox" name="o" checked /><span class="ml-item__texto"
              ><span class="ml-item__titulo">Achadinhos do Volante</span
              ><span class="ml-item__meta">512 participantes</span></span
            ></label
          ><label class="ml-opcao"
            ><input type="checkbox" name="o" disabled /><span class="ml-item__texto"
              ><span class="ml-item__titulo">Ofertas Carro</span
              ><span class="ml-item__meta">É o grupo das ofertas. Não pode ser origem.</span></span
            ></label
          >
        </div>
        <div class="ml-secao">
          <button type="button" class="ml-botao ml-botao--principal ml-botao--largo">Continuar</button
          ><button type="button" class="ml-botao ml-botao--texto">Voltar</button>
        </div>
      </div>
    </main>
  </body>
</html>
